# Livia Redis (data VPS). Password is injected via --requirepass by compose.

# Listen on all container interfaces; the HOST publish binding (REDIS_BIND_IP in
# compose) is what actually limits exposure to the private network.
bind 0.0.0.0
protected-mode no

# Durable-ish cache: append-only so conversation memory survives a restart.
appendonly yes
appendfsync everysec

# Cap memory so the cache can never crowd out the other sites on this VPS.
# Tune to taste; Livia's footprint is tiny.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Keyspace is all short-lived cache/memory; no RDB snapshots needed.
save ""
