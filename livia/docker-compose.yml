# CODE VPS — runs the Livia bot only. Data (Redis) lives on the other VPS;
# point REDIS_URL at it in .env (private network address).
#
# Isolation so it never collides with other sites on this VPS:
#  - dedicated network + container name prefix
#  - the /send API is published to 127.0.0.1 ONLY (reachable by a local backend
#    or an SSH/WireGuard tunnel, never the public internet). Change the left
#    side of the ports mapping if 3001 is taken on the host.
#  - binds no 80/443.
name: livia

services:
  bot:
    build: .
    image: livia-bot:latest
    container_name: livia-bot
    restart: unless-stopped
    env_file: .env
    # Chromium shared-memory headroom for puppeteer.
    shm_size: "1gb"
    environment:
      - CHROME_PATH=/usr/bin/chromium
      - PYTHON_PATH=python3
      - SEND_API_HOST=0.0.0.0        # inside the container; host binding is below
    ports:
      - "127.0.0.1:${SEND_API_PORT:-3001}:3001"
    volumes:
      # Persist the WhatsApp login so a restart doesn't need a re-scan.
      - livia-sessions:/app/sessions
      # Bind-mount knowledge so Clive edits files on the host; watcher hot-reloads.
      - ./knowledge:/app/knowledge
    networks:
      - livia-net

volumes:
  livia-sessions:

networks:
  livia-net:
    name: livia-net
