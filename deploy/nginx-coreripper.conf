# Nginx snippet for coreripper.site — proxy timeouts + fast-fail on a stuck
# upstream. Drop this into the existing server{} block (or replace the current
# `location /api/` and `location /admin/` blocks with these). Then:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Why: without explicit timeouts, Nginx uses proxy_connect_timeout=60s and
# proxy_read_timeout=60s. When Gunicorn workers are all busy (e.g. all blocked
# on a slow outbound HTTP call somewhere in Django), a new request sits in the
# accept queue and Cloudflare eventually retries or times out — visible to
# users as a 20–60s stall on any endpoint, including cheap ones like
# /api/stats/. Failing fast lets Cloudflare/curl see a real 502/504 instead
# of a silent hang, and gets the client an actionable error.

upstream coreripper_gunicorn {
    server unix:/srv/coreripper/backend/gunicorn.sock;
}

location /api/ {
    proxy_pass http://coreripper_gunicorn;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Fail fast rather than hanging when the socket is missing or workers
    # are all stuck (the 2026-07-30 outage pattern).
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    proxy_next_upstream   error timeout http_502 http_503;
}

location /admin/ {
    proxy_pass http://coreripper_gunicorn;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    proxy_next_upstream   error timeout http_502 http_503;
}
